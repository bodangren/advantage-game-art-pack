  "/>

  <!-- Inner Sparkle Ring / Highlights (evenodd, selective pixels) -->
  <!-- Top/Bottom ticks -->
  <rect x="15" y="3" width="2" height="2" fill="var(--glow-light)"/>
  <rect x="15" y="27" width="2" height="2" fill="var(--glow-light)"/>
  <!-- Left/Right ticks -->
  <rect x="3" y="15" width="2" height="2" fill="var(--glow-light)"/>
  <rect x="27" y="15" width="2" height="2" fill="var(--glow-light)"/>
  
  <!-- Additional glowing ticks on the ring -->
