  <rect x="21" y="25" width="1.5" height="1.5" fill="var(--glow-light)"/>
  <rect x="4" y="9" width="1.5" height="1.5" fill="var(--glow-light)"/>
  <rect x="26" y="9" width="1.5" height="1.5" fill="var(--glow-light)"/>
  <rect x="4" y="21" width="1.5" height="1.5" fill="var(--glow-light)"/>
  <rect x="26" y="21" width="1.5" height="1.5" fill="var(--glow-light)"/>
  
