<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 20">
  <!-- Wooden Chest Base Planks -->
  <rect x="2" y="2" width="20" height="17" fill="var(--wood)"/>
  <!-- Plank lines and highlights -->
  <rect x="2" y="2" width="20" height="2" fill="var(--wood-light)"/>
  <rect x="2" y="4" width="20" height="1" fill="var(--wood-shadow)"/>
  <rect x="2" y="8" width="20" height="2" fill="var(--wood-light)"/>
  <rect x="2" y="10" width="20" height="1" fill="var(--wood-shadow)"/>
  <rect x="2" y="14" width="20" height="1" fill="var(--wood-shadow)"/>
  <rect x="2" y="17" width="20" height="2" fill="var(--wood-shadow)"/>
  
  <!-- Outer Metal Frame/Borders (Steel bands) -->
  <!-- Left/Right borders -->
  <rect x="2" y="2" width="2.5" height="17" fill="var(--metal)"/>
  <rect x="19.5" y="2" width="2.5" height="17" fill="var(--metal)"/>
  <!-- Top/Bottom/Middle borders -->
  <rect x="2" y="2" width="20" height="2.5" fill="var(--metal)"/>
  <rect x="2" y="9.5" width="20" height="2.5" fill="var(--metal)"/>
  <rect x="2" y="16.5" width="20" height="2.5" fill="var(--metal)"/>
  
  <!-- Vertical Metal Bands -->
  <rect x="6.5" y="2" width="2" height="17" fill="var(--metal)"/>
  <rect x="15.5" y="2" width="2" height="17" fill="var(--metal)"/>
  
  <!-- Metal Highlights -->
  <rect x="2" y="2" width="20" height="1" fill="var(--metal-light)"/>
  <rect x="2.5" y="2" width="1" height="17" fill="var(--metal-light)"/>
  <rect x="6.5" y="2" width="0.75" height="17" fill="var(--metal-light)"/>
  <rect x="15.5" y="2" width="0.75" height="17" fill="var(--metal-light)"/>
  
  <!-- Corner brackets (mockup L-shapes) -->
  <rect x="2" y="2" width="4" height="4" fill="var(--metal-light)"/>
  <rect x="18" y="2" width="4" height="4" fill="var(--metal-light)"/>
  <rect x="2" y="15" width="4" height="4" fill="var(--metal-light)"/>
  <rect x="18" y="15" width="4" height="4" fill="var(--metal-light)"/>
  <!-- Corner cutouts back to main metal -->
  <rect x="3.5" y="3.5" width="2.5" height="2.5" fill="var(--metal)"/>
  <rect x="18" y="3.5" width="2.5" height="2.5" fill="var(--metal)"/>
  <rect x="3.5" y="15" width="2.5" height="2.5" fill="var(--metal)"/>
  <rect x="18" y="15" width="2.5" height="2.5" fill="var(--metal)"/>
  
  <!-- Lock / Latch (Central clasp) -->
  <rect x="10.5" y="8.5" width="3" height="5" fill="var(--metal)"/>
  <rect x="10.5" y="8.5" width="3" height="1" fill="var(--metal-light)"/>
  <rect x="11.5" y="10.5" width="1" height="1.5" fill="#000"/> <!-- Keyhole -->
</svg>
