<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32">
  <!-- Base Hair Shape (Flowing down sides, crown at y=12) -->
  <path d="M6 20c-1-6 2-8 6-8s7 2 6 8v8l-3-3l-3 3v-8z" fill="var(--hair)"/>
  
  <!-- Highlights (Crown and strands) -->
  <path d="M7 18c0-4 2-6 5-6s2 1 3 3l-1 5l-4-1z" fill="var(--hair-light)"/>
  <path d="M5 20h2v5l-2-2z" fill="var(--hair-light)"/>
  
  <!-- Shadows (Underneath and back strands) -->
  <path d="M12 12c2 0 6 2 6 6l-1 8l-2-2l-1-6z" fill="var(--hair-shadow)"/>
  <path d="M17 20h2v5l-2-2z" fill="var(--hair-shadow)"/>
  
  <!-- Part in the middle -->
  <rect x="11.5" y="12" width="1" height="4" fill="var(--hair-shadow)"/>
</svg>
