<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16">
  <!-- Crackling Dragon Flame -->
  <!-- Base Flame (Orange) -->
  <path d="M2 8c2-2 6-4 12-6c6-2 10 0 10 4c0 3-4 6-10 8c-6 2-10 0-12-6z" fill="var(--flame)"/>
  <path d="M4 8c3-3 8-5 14-3c6 2 6 4 2 5c-4 1-13 1-16-2z" fill="var(--flame)"/>
  
  <!-- Hot Inner Core (Light Orange/Yellow) -->
  <path d="M4 8c2-1 5-2 10-2c5 0 8 1 8 2c0 1-3 2-8 2c-5 0-8-1-10-2z" fill="var(--flame-light)"/>
  <rect x="8" y="7" width="8" height="2" fill="var(--flame-light)"/>
  
  <!-- Embers (Yellow core particles flying off) -->
  <rect x="20" y="3" width="2" height="2" fill="var(--ember)"/>
  <rect x="22" y="6" width="1.5" height="1.5" fill="var(--ember)"/>
  <rect x="18" y="11" width="2" height="2" fill="var(--ember)"/>
  <rect x="23" y="10" width="1" height="1" fill="var(--ember)"/>
  <polygon points="12,5 14,4 13,6" fill="var(--ember)"/>
  <polygon points="15,10 17,9 16,11" fill="var(--ember)"/>
</svg>
