<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 28">
  <!-- Club Head (Knotted heavy wood, centered at x=10) -->
  <path d="M5 12c-3-4-1-10 3-11s9 2 10 6s-2 10-6 11z" fill="var(--wood)"/>
  <!-- Highlight -->
  <path d="M8 2c-1 2-1 6 2 7c3 1 5-1 6-4c1-2 0-4-2-5c-2-1-4-1-6 2z" fill="var(--wood-light)"/>
  <!-- Shadows -->
  <path d="M10 12c-1 2 1 4 4 3c2-1 3-4 2-6c-1 2-2 3-4 3z" fill="var(--wood-shadow)"/>
  
  <!-- Knots & Spikes -->
  <circle cx="8" cy="4" r="2" fill="var(--wood-shadow)"/>
  <circle cx="13" cy="8" r="2.5" fill="var(--wood-shadow)"/>
  <!-- Bone Spikes (Pointing left and right) -->
  <polygon points="15,4 19,2 17,6" fill="var(--bone)"/>
  <polygon points="5,6 1,4 4,3" fill="var(--bone)"/>
  <polygon points="10,1 12,0 11,3" fill="var(--bone)"/>
  
  <!-- Handle / Shaft (Centered at x=10) -->
  <rect x="9" y="11" width="3" height="15" fill="var(--wood)"/>
  <rect x="9" y="11" width="1" height="15" fill="var(--wood-light)"/>
  <rect x="11" y="11" width="1" height="15" fill="var(--wood-shadow)"/>
  
  <!-- Leather Grip Wrap -->
  <rect x="9" y="17" width="3" height="5" fill="#7a4b2a"/>
  <rect x="9" y="18" width="3" height="1" fill="#5f4527"/>
  <rect x="9" y="21" width="3" height="1" fill="#5f4527"/>
</svg>
