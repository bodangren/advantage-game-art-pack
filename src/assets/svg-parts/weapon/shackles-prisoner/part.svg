<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 28">
  <!-- Wrist Shackles -->
  <!-- Left wrist band -->
  <rect x="1" y="8" width="5" height="4" fill="var(--metal)"/>
  <rect x="1" y="8" width="5" height="1" fill="var(--metal-light)"/>
  <rect x="1" y="11" width="5" height="1" fill="var(--metal-shadow)"/>
  
  <!-- Right wrist band -->
  <rect x="14" y="8" width="5" height="4" fill="var(--metal)"/>
  <rect x="14" y="8" width="5" height="1" fill="var(--metal-light)"/>
  <rect x="14" y="11" width="5" height="1" fill="var(--metal-shadow)"/>
  
  <!-- Heavy Blocky Chain Links between wrists -->
  <!-- Link 1 (vertical, from left wrist) -->
  <rect x="3" y="11" width="1" height="3" fill="var(--metal-light)"/>
  <rect x="4" y="11" width="1" height="3" fill="var(--metal-shadow)"/>
  
  <!-- Link 2 (horizontal) -->
  <rect x="4" y="13" width="4" height="1" fill="var(--metal-light)"/>
  <rect x="4" y="14" width="4" height="1" fill="var(--metal-shadow)"/>
  
  <!-- Link 3 (vertical) -->
  <rect x="7" y="14" width="1" height="4" fill="var(--metal-light)"/>
  <rect x="8" y="14" width="1" height="4" fill="var(--metal-shadow)"/>
  
  <!-- Link 4 (horizontal, center lowest point) -->
  <rect x="8" y="16" width="4" height="1" fill="var(--metal-light)"/>
  <rect x="8" y="17" width="4" height="1" fill="var(--metal-shadow)"/>
  
  <!-- Link 5 (vertical) -->
  <rect x="11" y="14" width="1" height="4" fill="var(--metal-light)"/>
  <rect x="12" y="14" width="1" height="4" fill="var(--metal-shadow)"/>
  
  <!-- Link 6 (horizontal) -->
  <rect x="12" y="13" width="4" height="1" fill="var(--metal-light)"/>
  <rect x="12" y="14" width="4" height="1" fill="var(--metal-shadow)"/>
  
  <!-- Link 7 (vertical, to right wrist) -->
  <rect x="15" y="11" width="1" height="3" fill="var(--metal-light)"/>
  <rect x="16" y="11" width="1" height="3" fill="var(--metal-shadow)"/>
</svg>
