<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 48">
  <!-- Torso & Abs (Muscular chest mass) -->
  <path d="M 6,13 h 12 l 1,12 l -1,13 h -10 l -1,-13 z" fill="var(--skin)"/>
  <path d="M 12,13 h 6 l 1,12 l -1,13 h -5 z" fill="var(--skin-shadow)"/>
  
  <!-- Chest/Pec definition -->
  <!-- Left Pec -->
  <path d="M 6,14 h 6 v 4 h -6 z" fill="var(--skin-light)"/>
  <path d="M 6,18 h 6 v 1 h -6 z" fill="var(--skin-shadow)"/>
  <!-- Right Pec -->
  <path d="M 12,14 h 6 v 4 h -6 z" fill="var(--skin)"/>
  <path d="M 12,18 h 6 v 1 h -6 z" fill="var(--skin-shadow)"/>
  
  <!-- Abs definition (Six-pack) -->
  <!-- Left abs -->
  <rect x="7" y="20" width="4" height="2" fill="var(--skin-light)"/>
  <rect x="7" y="23" width="4" height="2" fill="var(--skin-light)"/>
  <rect x="7" y="26" width="4" height="2" fill="var(--skin-light)"/>
  <!-- Right abs -->
  <rect x="13" y="20" width="4" height="2" fill="var(--skin-shadow)"/>
  <rect x="13" y="23" width="4" height="2" fill="var(--skin-shadow)"/>
  <rect x="13" y="26" width="4" height="2" fill="var(--skin-shadow)"/>
  <!-- Center ab line -->
  <rect x="11.5" y="19" width="1" height="10" fill="var(--skin-shadow)"/>
  
  <!-- Collar Chains (Heavy iron collar around neck/shoulders) -->
  <path d="M 5,13 c 1,2 3,3 7,3 s 6,-1 7,-3 c 0,2 -2,4 -7,4 s -7,-2 -7,-4 z" fill="#3a3c42"/>
  <rect x="7" y="14" width="2" height="2" fill="#5a5d64"/>
  <rect x="15" y="14" width="2" height="2" fill="#5a5d64"/>
  <rect x="11.5" y="15" width="1" height="2" fill="#3a3c42"/>
  
  <!-- Left Muscular Arm (Foreground) -->
  <path d="M 6,13 c -2,1 -4,3 -4,6 c 0,4 2,8 3,11 c 1,1 1,0 1,-2 c 0,-3 -2,-6 -2,-9 c 0,-2 1,-3 2,-3 z" fill="var(--skin)"/>
  <path d="M 3,17 c -1,1 -1,2 0,3 c 1,1 2,0 2,-2 c 0,-1 -1,-1 -2,-1 z" fill="var(--skin-light)"/>
  <path d="M 4,23 c 0,3 1,5 1,7 h -1 c -1,-2 -1,-4 -1,-7 z" fill="var(--skin-light)"/>
  <!-- Left Hand (Hanging down, long fingers) -->
  <path d="M 4,30 c -1,1 -2,3 -2,5 c 0,2 1,3 2,3 c 1,0 1,-1 1,-3 v -5 z" fill="var(--skin-shadow)"/>
  
  <!-- Right Muscular Arm (Foreground) -->
  <path d="M 18,13 c 2,1 4,3 4,6 c 0,4 -2,8 -3,11 c -1,1 -1,0 -1,-2 c 0,-3 2,-6 2,-9 c 0,-2 -1,-3 -2,-3 z" fill="var(--skin)"/>
  <path d="M 19,17 c 1,1 1,2 0,3 c -1,1 -2,0 -2,-2 c 0,-1 1,-1 2,-1 z" fill="var(--skin-light)"/>
  <path d="M 19,23 c 0,3 -1,5 -1,7 h 1 c 1,-2 1,-4 1,-7 z" fill="var(--skin-shadow)"/>
  <!-- Right Hand (Hanging down) -->
  <path d="M 18,30 c 1,1 2,3 2,5 c 0,2 -1,3 -2,3 c -1,0 -1,-1 -1,-3 v -5 z" fill="var(--skin-shadow)"/>
  
  <!-- Bare Legs & Feet (Protruding below pants) -->
  <!-- Left Leg -->
  <rect x="7" y="38" width="3" height="7" fill="var(--skin)"/>
  <rect x="7" y="38" width="1" height="7" fill="var(--skin-light)"/>
  <!-- Left Foot with toes (Centered around x=8) -->
  <path d="M 5,45 h 6 v 3 h -6 z" fill="var(--skin-shadow)"/>
  <!-- Toes -->
  <rect x="5" y="47" width="1" height="1" fill="var(--skin-light)"/>
  <rect x="6.5" y="47" width="1" height="1" fill="var(--skin-light)"/>
  <rect x="8" y="47" width="1" height="1" fill="var(--skin-light)"/>
  <rect x="9.5" y="47" width="1" height="1" fill="var(--skin)"/>
  
  <!-- Right Leg -->
  <rect x="14" y="38" width="3" height="7" fill="var(--skin)"/>
  <rect x="16" y="38" width="1" height="7" fill="var(--skin-shadow)"/>
  <!-- Right Foot with toes (Centered around x=16) -->
  <path d="M 13,45 h 6 v 3 h -6 z" fill="var(--skin-shadow)"/>
  <!-- Toes -->
  <rect x="18" y="47" width="1" height="1" fill="var(--skin-shadow)"/>
  <rect x="16.5" y="47" width="1" height="1" fill="var(--skin-shadow)"/>
  <rect x="15" y="47" width="1" height="1" fill="var(--skin)"/>
  <rect x="13.5" y="47" width="1" height="1" fill="var(--skin)"/>
  
  <!-- Head (Proportioned, facing forward, worn expression) -->
  <path d="M 8,4 c 0,-2 2,-3 4,-3 s 4,1 4,3 v 6 c 0,2 -2,3 -4,3 s -4,-1 -4,-3 z" fill="var(--skin)"/>
  <!-- Head highlights -->
  <path d="M 9,4 h 6 v 2 h -6 z" fill="var(--skin-light)"/>
  <!-- Head shadow (Lower right) -->
  <path d="M 12,6 c 2,0 4,1 4,3 c 0,1 -1,2 -4,2 s -4,-1 -4,-2" fill="var(--skin-shadow)"/>
  <!-- Detailed face: eyes, nose, mouth -->
  <rect x="9" y="5" width="2" height="1" fill="#000"/> <!-- Left eye -->
  <rect x="13" y="5" width="2" height="1" fill="#000"/> <!-- Right eye -->
  <rect x="11.5" y="6" width="1" height="2" fill="var(--skin-shadow)"/> <!-- Nose -->
  <rect x="10.5" y="9" width="3" height="1" fill="#5c3a21"/> <!-- Mouth -->
</svg>
